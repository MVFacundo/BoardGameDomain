<div class="d-flex align-items-center">    
    <div class="col-4 justify-content-center h-100">
        <img class="w-100 h-80" [src]="game!.image">
    </div>    
    <div class="col-8 h-80">
        <h5>{{game!.name}}</h5>
        <p>{{game!.description}}</p>
        <p>{{game!.players}}</p>
        <p>{{game!.duration}}</p>
        <p>{{game!.difficulty}}</p>
    </div>
</div>
