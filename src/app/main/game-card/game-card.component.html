<div class="d-flex align-items-center">    
    <div class="col-4 justify-content-center h-100">
        <img class="img-card img-fluid w-100 h-100 py-1 ps-1" [src]="game!.image">
    </div>    
    <div class="col-8 h-100 d-flex flex-column align-items-center">
        <h5>{{game!.name}}</h5>
        <p>{{game!.description}}</p>
        <div class="d-flex">
            <p>{{game!.minPlayers}}</p>
            <p>{{game!.maxPlayers}}</p>
            <p>{{game!.duration}}</p>
            <p>{{game!.difficulty}}</p>
        </div>
    </div>
</div>
